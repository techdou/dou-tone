name: Validate Skill

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent Skills reference validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate Skill against the Agent Skills specification
        run: skills-ref validate .

      - name: Compile Python scripts
        run: python -m py_compile scripts/dou_lint.py

      - name: Run lint self-test
        run: python scripts/dou_lint.py --self-test
